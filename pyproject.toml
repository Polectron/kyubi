[project]
name = "kyubi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Polectron", email = "polectron@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]>=3.3.8",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
addopts = "-n 4"

[project.scripts]
kyubi = "kyubi:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
