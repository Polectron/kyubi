name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kyubi
          POSTGRES_PASSWORD: kyubi
          POSTGRES_DB: kyubi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kyubi -d kyubi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      KYUBI_POSTGRES_DSN: postgresql://kyubi:kyubi@localhost:5432/kyubi
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest --engine=${{ matrix.engine }}
