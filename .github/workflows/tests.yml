name: Tests

on:
  pull_request:
  workflow_call:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kyubi
          POSTGRES_PASSWORD: kyubi
          POSTGRES_DB: kyubi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kyubi -d kyubi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      KYUBI_POSTGRES_DSN: postgresql://kyubi:kyubi@localhost:5432/kyubi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: 0.13.9
          enable-cache: true
      - run: uv python install 3.13
      - name: Check release and project versions
        run: |
          python3 - <<'PY'
          import pathlib
          import tomllib

          release_version = pathlib.Path("version.txt").read_text().strip()
          project_version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          assert release_version == project_version, (release_version, project_version)
          PY
      - run: uv sync --locked --python 3.13
      - run: uv run --python 3.13 pytest --engine=${{ matrix.engine }}
      - run: uv build --python 3.13
